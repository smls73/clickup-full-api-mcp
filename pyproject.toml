[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickup-mcp"
version = "1.0.0"
description = "Comprehensive MCP server for ClickUp API - full coverage of all endpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yes Gaming", email = "dev@yesgaming.com" }
]
keywords = ["mcp", "clickup", "api", "automation", "project-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
clickup-mcp = "clickup_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clickup_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
